name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  shell-and-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck bats ripgrep
          sudo locale-gen en_US.UTF-8

      - name: Install dependencies (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          brew install shellcheck bats-core ripgrep

      - name: Run checks
        run: RUN_INTEGRATION_TESTS=1 bash scripts/check.sh