name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  shell-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck bats ripgrep

      - name: Run checks
        run: bash scripts/check.sh
